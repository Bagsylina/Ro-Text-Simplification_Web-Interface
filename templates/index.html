<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Simplification Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .content {
            padding: 40px;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s ease;
        }

        .textarea:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

        .button-section {
            text-align: center;
            margin: 30px 0;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-section {
            display: none;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            margin-top: 30px;
        }

        .error {
            background: #fee;
            border-left: 4px solid #f44336;
            color: #c62828;
        }

        .success {
            background: #f0fdf4;
            border-left: 4px solid #22c55e;
        }

        .result-text {
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .tab-navigation {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #e1e5e9;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }

        .tab-btn.active {
            color: #4facfe;
            border-bottom-color: #4facfe;
        }

        .tab-btn:hover {
            color: #4facfe;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .input-field {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

        .options-section {
            margin-top: 15px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 14px;
            color: #555;
        }

        .checkbox-label input[type="checkbox"] {
            margin-right: 10px;
            transform: scale(1.2);
        }

        .article-info {
            background: #f0f8ff;
            border: 1px solid #4facfe;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .article-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .article-url {
            font-size: 14px;
            color: #4facfe;
            text-decoration: none;
        }

        .article-url:hover {
            text-decoration: underline;
        }

        .content-type {
            font-size: 12px;
            color: #666;
            font-style: italic;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .content {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .btn {
                padding: 12px 30px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Romanian Text Simplification Tool</h1>
            <p>Make your text clearer and easier to understand</p>
        </div>
        
        <div class="content">
            <!-- Tab Navigation -->
            <div class="tab-navigation">
                <button class="tab-btn active" data-tab="text">Text Input</button>
                <button class="tab-btn" data-tab="wikipedia">Wikipedia Article</button>
            </div>

            <!-- Text Input Tab -->
            <div id="textTab" class="tab-content active">
                <form id="simplifyForm">
                    <div class="input-section">
                        <label for="inputText" class="label">Enter your text to simplify:</label>
                        <textarea 
                            id="inputText" 
                            name="text" 
                            class="textarea" 
                            placeholder="Paste or type your text here..."
                            maxlength="10000"
                        ></textarea>
                        <div class="char-count">
                            <span id="charCount">0</span>/10,000 characters
                        </div>
                    </div>
                    
                    <div class="button-section">
                        <button type="submit" class="btn" id="simplifyBtn">
                            Simplify Text
                        </button>
                    </div>
                </form>
            </div>

            <!-- Wikipedia Tab -->
            <div id="wikipediaTab" class="tab-content">
                <form id="wikipediaForm">
                    <div class="input-section">
                        <label for="wikiInput" class="label">Wikipedia URL or Article Title:</label>
                        <input 
                            type="text" 
                            id="wikiInput" 
                            name="wiki_input" 
                            class="input-field"
                            placeholder="e.g., https://en.wikipedia.org/wiki/Artificial_intelligence or just 'Artificial intelligence'"
                        />
                        <div class="options-section">
                            <label class="checkbox-label">
                                <input type="checkbox" id="useFullContent" name="use_full_content">
                                <span class="checkmark"></span>
                                Use full article content (might take a long time)
                            </label>
                        </div>
                    </div>
                    
                    <div class="button-section">
                        <button type="submit" class="btn" id="wikipediaBtn">
                            Simplify Wikipedia Article
                        </button>
                    </div>
                </form>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Processing your text...</p>
            </div>
            
            <div class="result-section" id="resultSection">
                <label class="label">Simplified text:</label>
                <div class="result-text" id="resultText"></div>
            </div>
        </div>
    </div>

    <script>
        const textForm = document.getElementById('simplifyForm');
        const wikipediaForm = document.getElementById('wikipediaForm');
        const inputText = document.getElementById('inputText');
        const wikiInput = document.getElementById('wikiInput');
        const charCount = document.getElementById('charCount');
        const loading = document.getElementById('loading');
        const resultSection = document.getElementById('resultSection');
        const resultText = document.getElementById('resultText');
        const simplifyBtn = document.getElementById('simplifyBtn');
        const wikipediaBtn = document.getElementById('wikipediaBtn');
        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');

        // Tab switching functionality
        tabBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const targetTab = this.dataset.tab;
                
                // Update tab buttons
                tabBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                // Update tab content
                tabContents.forEach(content => {
                    content.classList.remove('active');
                });
                document.getElementById(targetTab + 'Tab').classList.add('active');
                
                // Hide results when switching tabs
                resultSection.style.display = 'none';
            });
        });

        // Update character count
        inputText.addEventListener('input', function() {
            const count = this.value.length;
            charCount.textContent = count;
            
            if (count > 10000) {
                charCount.style.color = '#f44336';
            } else {
                charCount.style.color = '#666';
            }
        });

        // Handle text form submission
        textForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const text = inputText.value.trim();
            
            if (!text) {
                showError('Please enter some text to simplify.');
                return;
            }
            
            if (text.length > 10000) {
                showError('Text is too long. Please limit to 10,000 characters.');
                return;
            }
            
            await processSimplification('/simplify', new FormData(textForm), simplifyBtn);
        });

        // Handle Wikipedia form submission
        wikipediaForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const wikiInputValue = wikiInput.value.trim();
            
            if (!wikiInputValue) {
                showError('Please enter a Wikipedia URL or article title.');
                return;
            }
            
            const formData = new FormData(wikipediaForm);
            formData.set('use_full_content', document.getElementById('useFullContent').checked);
            
            await processSimplification('/simplify-wikipedia', formData, wikipediaBtn);
        });

        async function processSimplification(endpoint, formData, button) {
            // Show loading state
            loading.style.display = 'block';
            resultSection.style.display = 'none';
            button.disabled = true;
            
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    if (data.original_title) {
                        // Wikipedia result
                        showWikipediaResult(data);
                    } else {
                        // Regular text result
                        showResult(data.simplified);
                    }
                } else {
                    showError(data.error || 'An error occurred while processing your text.');
                }
                
            } catch (error) {
                console.error('Error:', error);
                showError('Failed to connect to the server. Please try again.');
            } finally {
                loading.style.display = 'none';
                button.disabled = false;
            }
        }

        function showResult(text) {
            resultText.innerHTML = `<div class="result-text">${escapeHtml(text)}</div>`;
            resultSection.className = 'result-section success';
            resultSection.style.display = 'block';
            resultSection.scrollIntoView({ behavior: 'smooth' });
        }

        function showWikipediaResult(data) {
            const articleInfo = `
                <div class="article-info">
                    <div class="article-title">${escapeHtml(data.original_title)}</div>
                    <a href="${escapeHtml(data.original_url)}" target="_blank" class="article-url">
                        View original article
                    </a>
                    <div class="content-type">Simplified ${data.content_type}</div>
                </div>
            `;
            
            resultText.innerHTML = `<div class="result-text">${escapeHtml(data.simplified_content)}</div>`;
            resultSection.className = 'result-section success';
            resultSection.style.display = 'block';
            resultSection.scrollIntoView({ behavior: 'smooth' });
        }

        function showError(message) {
            resultText.innerHTML = `<div class="result-text">${escapeHtml(message)}</div>`;
            resultSection.className = 'result-section error';
            resultSection.style.display = 'block';
            resultSection.scrollIntoView({ behavior: 'smooth' });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
